<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>枝叶 · 登入与注册</title>
<script src="./zy-config.js"></script>
<script src="./vendor/supabase.js"></script>
<script src="./zy-store.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#0B1532">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="application-name" content="Zenith Yield">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;700&amp;display=swap">
<style>

.zy-d,.zy-l{transition:background .5s ease,color .5s ease}

.aurora-l{display:none}
.zy-l .aurora-l{display:block}
.zy-l .star{background:#6E93F0 !important;box-shadow:0 0 6px rgba(110,147,240,.7)}
.zy-l .star:nth-child(3n){background:#F2A93B !important;box-shadow:0 0 6px rgba(242,169,59,.7)}
.zy-l .star:nth-child(5n){background:#E86FA5 !important;box-shadow:0 0 6px rgba(232,111,165,.7)}
.zy-l .sun{background:radial-gradient(circle at 38% 34%,#FFFBEA 0%,#FFD66B 45%,#F29D1E 100%) !important}
.zy-l .comet span{background:#FFFFFF !important}
@keyframes blobA{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8%,6%) scale(1.15)}}
@keyframes blobB{0%,100%{transform:translate(0,0) scale(1.1)}50%{transform:translate(-10%,4%) scale(.95)}}
@keyframes blobC{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-8%) scale(1.2)}}
.themebtn{transition:background .2s ease}
.themebtn:hover{background:rgba(127,140,170,.16)}

body{margin:0}
a{color:var(--z1)}a:hover{color:var(--z2)}
@keyframes twinkle{0%,100%{opacity:.18}50%{opacity:.95}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.star{animation:twinkle 4s ease-in-out infinite}
.orb{animation:spin linear infinite}
.rise{animation:rise .7s ease backwards}
.glass{background:var(--z3);border:1px solid var(--z4);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
input{transition:border-color .2s ease,box-shadow .2s ease}
input:focus{outline:none;border-color:var(--z1) !important;box-shadow:0 0 0 4px var(--z5)}
.cta{transition:transform .2s ease,box-shadow .25s ease}
.cta:hover{transform:translateY(-2px);box-shadow:0 10px 30px var(--z6)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
.st0{animation:none !important;opacity:.55}

.langbtn{transition:background .2s ease}
.lang-en{letter-spacing:0}
section[id]{scroll-margin-top:96px}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

.zp{height:32px;padding:0 12px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;opacity:.55;font:inherit;font-size:13px;cursor:pointer}
.zp.on{opacity:1;font-weight:600}
.zprefs{display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px}

html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
@media (max-width:640px){input,select,textarea{font-size:16px !important}}

.lf{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--z18);min-width:0}
.li{height:46px;width:100%;box-sizing:border-box;padding:0 12px;border:1px solid var(--z19);border-radius:10px;background:var(--z20);font:inherit;font-size:15px;font-weight:400;color:var(--z2)}
.li:focus{outline:none;border-color:var(--z1);box-shadow:0 0 0 4px var(--z5)}
button:disabled{opacity:.6;cursor:default}
html:has(.zy-d),html:has(.zy-d) body{background:#0B1532}
html:has(.zy-l),html:has(.zy-l) body{background:#F6F8FC}
html:has(.zy-l),html:has(.zy-l) body{background:#F5F9FF linear-gradient(165deg, #FFF3E8 0%, #F6EEFF 34%, #E9F1FF 66%, #F5F9FF 100%) fixed}
</style>
</helmet>
<div class="{{themeCls}}" style="position: relative; overflow: hidden; overflow: clip; min-height: 100vh; background: var(--zy-sky); color: var(--z10); font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column">
<div aria-hidden="true" class="aurora-l" style="position: absolute; inset: 0; overflow: hidden; pointer-events: none">
<span style="position: absolute; left: -10%; top: -15%; width: 60vmax; height: 60vmax; border-radius: 50%; background: radial-gradient(circle, rgba(255,190,140,.55) 0%, rgba(255,190,140,0) 65%); animation: blobA 22s ease-in-out infinite"></span>
<span style="position: absolute; right: -15%; top: 5%; width: 65vmax; height: 65vmax; border-radius: 50%; background: radial-gradient(circle, rgba(170,140,255,.45) 0%, rgba(170,140,255,0) 65%); animation: blobB 28s ease-in-out infinite"></span>
<span style="position: absolute; left: 20%; bottom: -25%; width: 70vmax; height: 70vmax; border-radius: 50%; background: radial-gradient(circle, rgba(110,170,255,.45) 0%, rgba(110,170,255,0) 65%); animation: blobC 34s ease-in-out infinite"></span>
</div>


<div aria-hidden="true" style="position: absolute; inset: 0; pointer-events: none">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="100">
<span class="{{s.k}}" style="position: absolute; left: {{s.x}}%; top: {{s.y}}%; width: {{s.r}}px; height: {{s.r}}px; border-radius: 50%; background: var(--z11); animation-delay: {{s.d}}s; animation-duration: {{s.t}}s"></span>
</sc-for>
<sc-for list="{{rings}}" as="r" hint-placeholder-count="3">
<div style="position: absolute; left: 50%; top: 50%; width: {{r.s}}px; height: {{r.s}}px; margin: -{{r.h}}px 0 0 -{{r.h}}px; box-sizing: border-box; border-radius: 50%; border: 1px solid {{r.c}}"></div>
<div class="orb" style="position: absolute; left: 50%; top: 50%; width: {{r.s}}px; height: {{r.s}}px; margin: -{{r.h}}px 0 0 -{{r.h}}px; animation-duration: {{r.t}}s"><span style="position: absolute; left: 50%; top: -4px; width: 8px; height: 8px; margin-left: -4px; border-radius: 50%; background: var(--z2); box-shadow: 0 0 12px 4px {{r.g}}"></span></div>
</sc-for>
</div>

<header style="position: sticky; top: 0; z-index: 50; max-width: 1160px; margin: 0 auto; padding: calc(18px + env(safe-area-inset-top)) 24px 18px; width: 100%; box-sizing: border-box; display: flex; align-items: center; justify-content: space-between; gap: 12px">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--z2)">
<span style="width: 32px; height: 32px; border-radius: 9px; background: var(--z12); display: flex; align-items: center; justify-content: center; box-shadow: 0 0 18px var(--z13)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 21V10M12 14l-5-4M12 12l5-4"></path><circle cx="7" cy="8" r="2" fill="#FFFFFF" stroke="none"></circle><circle cx="17" cy="6" r="2" fill="#FFFFFF" stroke="none"></circle><circle cx="12" cy="5" r="2" fill="#FFFFFF" stroke="none"></circle></svg></span>
<span style="font-size: 18px; font-weight: 700">{{L.k2}}</span>
</a>
<div style="display: flex; align-items: center; gap: 14px">

<a href="Main.dc.html" style="font-size: 14px; color: var(--z15); text-decoration: none">{{L.k3}}</a>
</div>
</header>

<main style="position: relative; z-index: 1; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 12px 16px calc(32px + env(safe-area-inset-bottom))">
<sc-if value="{{instShow}}" hint-placeholder-val="{{false}}">
<div class="glass rise" role="region" aria-label="{{instTitle}}" style="width: 100%; max-width: 440px; box-sizing: border-box; border-radius: 16px; padding: 12px 10px 12px 12px; display: flex; align-items: center; gap: 12px"><img src="./icons/zy-icon-192.png" alt="" width="44" height="44" style="width: 44px; height: 44px; flex: none; border-radius: 11px"><span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px"><b style="font-size: 14px; color: var(--z2)">{{instTitle}}</b><span style="font-size: 12px; line-height: 1.5; color: var(--z15)">{{instDesc}}</span></span><sc-if value="{{instCan}}" hint-placeholder-val="{{false}}"><button type="button" class="cta" onClick="{{instGo}}" style="height: 36px; flex: none; padding: 0 14px; border: none; border-radius: 9px; background: var(--z21); color: var(--z8); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer">{{instBtn}}</button></sc-if><button type="button" onClick="{{instNo}}" aria-label="{{instLater}}" title="{{instLater}}" style="width: 32px; height: 32px; flex: none; border: none; border-radius: 8px; background: transparent; color: var(--z15); font: inherit; font-size: 20px; line-height: 1; cursor: pointer">×</button></div>
</sc-if>
<div class="glass rise" style="width: 100%; max-width: 440px; border-radius: 20px; padding: 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 30px 80px var(--z16)">
<sc-if value="{{showTabs}}" hint-placeholder-val="{{true}}">
<div role="tablist" aria-label="{{t.tabs}}" style="display: flex; padding: 4px; background: var(--z17); border-radius: 12px">
<button type="button" role="tab" aria-selected="{{selIn}}" onClick="{{toLogin}}" style="flex: 1; height: 40px; border: none; border-radius: 9px; background: {{bgIn}}; color: {{fgIn}}; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{t.tIn}}</button>
<button type="button" role="tab" aria-selected="{{selUp}}" onClick="{{toSignup}}" style="flex: 1; height: 40px; border: none; border-radius: 9px; background: {{bgUp}}; color: {{fgUp}}; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{t.tUp}}</button>
</div>
</sc-if>

<sc-if value="{{noCloud}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; line-height: 1.6; color: var(--z15); padding: 10px 12px; border-radius: 10px; background: var(--z17)">{{t.noCloud}}</span></sc-if>

<sc-if value="{{vLogin}}" hint-placeholder-val="{{true}}">
<form onSubmit="{{signIn}}" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 26px; font-weight: 700; color: var(--z2)">{{t.h}}</h1><p style="margin: 0; font-size: 14px; color: var(--z15)">{{t.hSub}}</p></div>
<label class="lf">{{t.email}}<input class="li" type="email" autocomplete="email" value="{{raw.email}}" onInput="{{setEmail}}" placeholder="name@example.com"></label>
<label class="lf"><span style="display: flex; justify-content: space-between; gap: 8px">{{t.password}}<a href="#forgot" onClick="{{forgot}}" style="font-weight: 400">{{t.forgot}}</a></span><input class="li" type="password" autocomplete="current-password" value="{{raw.password}}" onInput="{{setPassword}}"></label>
<button type="submit" class="cta" disabled="{{busy}}" style="height: 48px; border: none; border-radius: 10px; background: var(--z21); color: var(--z8); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{goText}}</button>
</form>
</sc-if>

<sc-if value="{{vSignup}}" hint-placeholder-val="{{false}}">
<form onSubmit="{{signUp}}" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 26px; font-weight: 700; color: var(--z2)">{{t.uh}}</h1><p style="margin: 0; font-size: 14px; color: var(--z15)">{{t.uhSub}}</p></div>
<label class="lf">{{t.name}}<input class="li" type="text" autocomplete="name" value="{{raw.name}}" onInput="{{setName}}"></label>
<label class="lf">{{t.email}}<input class="li" type="email" autocomplete="email" value="{{raw.email}}" onInput="{{setEmail}}" placeholder="name@example.com"></label>
<label class="lf">{{t.password}}<input class="li" type="password" autocomplete="new-password" value="{{raw.password}}" onInput="{{setPassword}}" placeholder="{{t.pwPh}}"></label>
<button type="submit" class="cta" disabled="{{busy}}" style="height: 48px; border: none; border-radius: 10px; background: var(--z21); color: var(--z8); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{upText}}</button>
<span style="font-size: 12px; color: var(--z15)">{{t.agree}}</span>
</form>
</sc-if>

<sc-if value="{{vFamily}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 26px; font-weight: 700; color: var(--z2)">{{t.fh}}</h1><p style="margin: 0; font-size: 14px; color: var(--z15)">{{t.fhSub}}</p><span style="font-size: 13px; color: var(--z15)">{{t.signedAs}}{{raw.who}} · <a href="#out" onClick="{{signOut}}">{{t.signOut}}</a></span></div>
<form onSubmit="{{join}}" style="display: flex; flex-direction: column; gap: 10px">
<label class="lf">{{t.joinCode}}<input class="li" type="text" autocapitalize="characters" spellcheck="false" value="{{raw.code}}" onInput="{{setCode}}" placeholder="{{t.joinPh}}" style="letter-spacing: 2px; text-transform: uppercase"></label>
<button type="submit" class="cta" disabled="{{busy}}" style="height: 46px; border: none; border-radius: 10px; background: var(--z21); color: var(--z8); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{t.join}}</button>
</form>
<div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--z15)"><span style="flex: 1; height: 1px; background: var(--z19)"></span>{{t.or}}<span style="flex: 1; height: 1px; background: var(--z19)"></span></div>
<form onSubmit="{{create}}" style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 15px; font-weight: 600; color: var(--z2)">{{t.newFam}}</span>
<label class="lf">{{t.famName}}<input class="li" type="text" value="{{raw.fam}}" onInput="{{setFam}}" placeholder="{{t.famPh}}"></label>
<div style="display: flex; gap: 12px"><label class="lf" style="flex: 1">{{t.name}}<input class="li" type="text" value="{{raw.name}}" onInput="{{setName}}"></label><label class="lf" style="flex: 1">{{t.surname}}<input class="li" type="text" value="{{raw.surname}}" onInput="{{setSurname}}"></label></div>
<label class="lf">{{t.sex}}<select class="li" value="{{raw.sex}}" onChange="{{setSex}}"><option value="m">{{t.male}}</option><option value="f">{{t.female}}</option></select></label>
<button type="submit" disabled="{{busy}}" style="height: 46px; border-radius: 10px; border: 1px solid var(--z19); background: transparent; color: var(--z10); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{t.create}}</button>
</form>
</sc-if>

<sc-if value="{{vReset}}" hint-placeholder-val="{{false}}">
<form onSubmit="{{savePw}}" style="display: flex; flex-direction: column; gap: 14px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; color: var(--z2)">{{t.rh}}</h1>
<label class="lf">{{t.newPw}}<input class="li" type="password" autocomplete="new-password" value="{{raw.password}}" onInput="{{setPassword}}" placeholder="{{t.pwPh}}"></label>
<button type="submit" class="cta" disabled="{{busy}}" style="height: 48px; border: none; border-radius: 10px; background: var(--z21); color: var(--z8); font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">{{t.savePw}}</button>
</form>
</sc-if>

<span role="status" style="font-size: 13px; line-height: 1.5; color: {{msgColor}}">{{msg}}</span>

<sc-if value="{{showDemo}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--z15)"><span style="flex: 1; height: 1px; background: var(--z19)"></span>{{t.or}}<span style="flex: 1; height: 1px; background: var(--z19)"></span></div>
<button type="button" onClick="{{demo}}" style="height: 46px; border-radius: 10px; border: 1px solid var(--z19); background: transparent; color: var(--z10); font: inherit; font-size: 15px; font-weight: 500; cursor: pointer">{{t.demo}}</button>
<span style="margin-top: -8px; font-size: 12px; color: var(--z15); text-align: center">{{t.demoHint}}</span>
</sc-if>
<div style="display: flex; justify-content: center; padding-top: 4px; color: var(--z15)"><span class="zprefs"><button type="button" class="{{zyp.lzCls}}" onClick="{{zyp.setLangZh}}">中文</button><button type="button" class="{{zyp.leCls}}" onClick="{{zyp.setLangEn}}">English</button><span aria-hidden="true" style="opacity:.4">·</span><button type="button" class="{{zyp.tdCls}}" onClick="{{zyp.setThemeDark}}">{{zyp.darkText}}</button><button type="button" class="{{zyp.tlCls}}" onClick="{{zyp.setThemeLight}}">{{zyp.lightText}}</button></span></div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>

    });
  }
}
</script>
</body>
</html>
