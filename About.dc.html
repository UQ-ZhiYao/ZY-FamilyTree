<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    this._zyStop();
  }
  componentDidMount() {
    this._loadTheme();
  }
  _loadTheme() {
    if (window.ZY && !this._zyUnsub) {
      this._zyUnsub = window.ZY.subscribe(() => this.setState({ zyRev: window.ZY.rev }));
      window.ZY.ready().then(() => this.setState({ zyRev: window.ZY.rev }));
    }
    this._zyApply();
    if (this._zySync) return;
    // 跨页面同步：任何页面切换主题或语言，其它已打开的页面立刻跟着变
    this._zySync = () => this._zyApply();
    try { window.addEventListener('storage', this._zySync); window.addEventListener('focus', this._zySync); window.addEventListener('pageshow', this._zySync); document.addEventListener('visibilitychange', this._zySync); } catch (e) {}
    try { this._zyBC = new BroadcastChannel('zy-prefs'); this._zyBC.onmessage = this._zySync; } catch (e) {}
    try { this._zyPoll = setInterval(this._zySync, 1500); } catch (e) {}
  }
  _zyRead() {
    const o = {};
    try { const t = window.localStorage.getItem('zhiye-theme'); if (t === 'light' || t === 'dark') o.theme = t; } catch (e) {}
    try { const l = window.localStorage.getItem('zy-lang'); if (l === 'en' || l === 'zh') o.lang = l; } catch (e) {}
    return o;
  }
  _zyApply() {
    const o = this._zyRead();
    const st = this.state || {};
    const d = {};
    if (o.theme && o.theme !== (st.theme || 'dark')) d.theme = o.theme;
    if (o.lang && o.lang !== (st.lang || 'zh')) d.lang = o.lang;
    try { document.documentElement.lang = (d.lang || st.lang) === 'en' ? 'en' : 'zh-CN'; } catch (e) {}
    if (d.theme || d.lang) this.setState(d);
  }
  _zyStop() {
    if (this._zyUnsub) { this._zyUnsub(); this._zyUnsub = null; }
    if (!this._zySync) return;
    try { window.removeEventListener('storage', this._zySync); window.removeEventListener('focus', this._zySync); window.removeEventListener('pageshow', this._zySync); document.removeEventListener('visibilitychange', this._zySync); } catch (e) {}
    try { if (this._zyBC) this._zyBC.close(); } catch (e) {}
    try { clearInterval(this._zyPoll); } catch (e) {}
    this._zySync = null;
  }
  _zyPost() {
    try { if (this._zyBC) this._zyBC.postMessage(1); } catch (e) {}
  }
  renderVals() {
    this._zyBoot();
    const st = this.state || {};
    let v = this._rv();
    if (st.lang === 'en') v = this._zyI18n(v, 0);
    return Object.assign(v, this._zyChrome(st));
  }
  _zyChrome(st) {
    const light = st.theme === 'light';
    const en = st.lang === 'en';
    return {
      isLight: light, isDark: !light, isEn: en, isZh: !en,
      themeCls: (light ? 'zy-l' : 'zy-d') + (en ? ' lang-en' : ' lang-zh'),
      themeAria: en ? (light ? 'Switch to dark' : 'Switch to light') : (light ? '切换到深色' : '切换到浅色'),
      langText: en ? '中文' : 'EN', langAria: en ? '切换到中文' : 'Switch to English',
      L: en ? Component.__zy.LEN : Component.__zy.LZH,
      toggleTheme: (e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        const nt = light ? 'dark' : 'light';
        try { window.localStorage.setItem('zhiye-theme', nt); } catch (err) {}
        this.setState({ theme: nt }, () => this._zyPost());
      },
      toggleLang: (e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        const nl = en ? 'zh' : 'en';
        try { window.localStorage.setItem('zy-lang', nl); } catch (err) {}
        try { document.documentElement.lang = nl === 'en' ? 'en' : 'zh-CN'; } catch (err) {}
        this.setState({ lang: nl }, () => this._zyPost());
      }
    };
  }
  _zyHref(name, query) {
    let app = false;
    try { app = /\/App[A-Z]\w*\.dc\.html/.test(window.location.pathname); } catch (e) {}
    return (app ? 'App' : '') + name + '.dc.html' + (query ? '?' + query : '');
  }
  _zyQ(name) {
    try { return new URLSearchParams(window.location.search).get(name); } catch (e) { return null; }
  }
  _zyName(p) {
    if (!p) return '';
    const en = (this.state || {}).lang === 'en';
    return (en ? (p.nameEn || p.name) : (p.name || p.nameEn)) || '';
  }
  _zyGo(href) {
    try { window.location.href = href; } catch (e) {}
  }
  _zyBoot() {
    // 第一次渲染就用已保存的主题和语言，换页时不会先闪一下默认样式
    if (!this._zyFirst && !this._inner) {
      this._zyFirst = true;
      const o = this._zyRead();
