body{margin:0}
a{color:var(--z1)}a:hover{color:var(--z2)}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slideDown{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.top{animation:slideDown .5s ease backwards}
main > *{animation:fadeUp .6s ease backwards}
main > *:nth-child(1){animation-delay:.08s}
main > *:nth-child(2){animation-delay:.16s}
main > *:nth-child(3){animation-delay:.24s}
main > *:nth-child(4){animation-delay:.32s}
main > *:nth-child(5){animation-delay:.4s}
.tab{transition:background .2s ease,color .2s ease}
.tab:hover{background:var(--z3)}
button{transition:transform .2s ease,box-shadow .2s ease,background .2s ease}
button:hover{transform:translateY(-1px)}
input,select,textarea{transition:border-color .2s ease,box-shadow .2s ease}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--z1) !important;box-shadow:0 0 0 4px var(--z4)}
section,aside{transition:box-shadow .25s ease}
section:hover,aside:hover{box-shadow:0 10px 28px var(--z5)}
figure{animation:rise .55s cubic-bezier(.2,.8,.3,1.1) backwards;transition:transform .25s ease,box-shadow .25s ease}
figure:hover{transform:translateY(-5px);box-shadow:0 14px 30px var(--z6)}
figure:nth-child(2){animation-delay:.05s}figure:nth-child(3){animation-delay:.1s}figure:nth-child(4){animation-delay:.15s}
figure:nth-child(5){animation-delay:.2s}figure:nth-child(6){animation-delay:.25s}figure:nth-child(7){animation-delay:.3s}figure:nth-child(8){animation-delay:.35s}
tbody tr{transition:background .2s ease}
tbody tr:hover{background:var(--z7)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

.langbtn{transition:background .2s ease}
.lang-en{letter-spacing:0}

.zy-d{--tbg:rgba(10,18,44,.84);--tbd:rgba(157,203,255,.18);--tfg:#A3B5DA;--ton:#FFFFFF;--tpill:rgba(157,203,255,.16)}
.zy-l{--tbg:rgba(255,255,255,.9);--tbd:rgba(46,71,158,.14);--tfg:#5A6380;--ton:#1748E6;--tpill:rgba(23,72,230,.1)}
.tabbar{display:none}
.tbi{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;height:52px;border-radius:14px;font-size:11px;font-weight:500;text-decoration:none;color:var(--tfg);-webkit-tap-highlight-color:transparent}
.tbi.on{color:var(--ton);font-weight:600;background:var(--tpill)}

header nav{display:none !important}
header .uname{display:none !important}
header{padding:10px 12px 0 !important}
.tabbar{display:flex;position:fixed;z-index:60;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:5px;gap:4px;border-radius:20px;background:var(--tbg);border:1px solid var(--tbd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 10px 30px rgba(0,0,0,.22)}
main{padding:20px 16px calc(110px + env(safe-area-inset-bottom)) !important}

}

.zp{height:32px;padding:0 12px;border-radius:999px;border:1px solid currentColor;background:transparent;color:inherit;opacity:.55;font:inherit;font-size:13px;cursor:pointer}
.zp.on{opacity:1;font-weight:600}

.tabbar{transition:transform .28s ease,opacity .28s ease}

.tbi{position:relative}
.tbdot{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:999px;background:#E5484D;color:#FFFFFF;font-size:10px;font-style:normal;font-weight:700;line-height:16px;text-align:center}

.zy-pill{position:fixed;z-index:58;left:50%;bottom:18px;transform:translateX(-50%);max-width:calc(100% - 32px);box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:9px 10px 9px 16px;border-radius:999px;font-size:13px;line-height:1.4;background:var(--tbg);color:var(--pfg);border:1px solid var(--tbd);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 8px 24px rgba(0,0,0,.18)}

.zy-d{--pfg:#EAF2FF;--pbtn:#0B1532}
.zy-l{--pfg:#14171F;--pbtn:#FFFFFF}
.has-sheet .zy-pill{display:none}
@media (max-width:640px){header{display:none !important}main{padding-top:calc(16px + env(safe-area-inset-top)) !important}.centerpill{top:calc(12px + env(safe-area-inset-top)) !important}}
@media (max-width:640px){.zy-pill{bottom:calc(84px + env(safe-area-inset-bottom));border-radius:16px}}
@media (max-width:640px){.tabbar{left:22px !important;right:22px !important;padding:3px !important;gap:2px !important;border-radius:16px !important;bottom:calc(6px + env(safe-area-inset-bottom)) !important}.tbi{height:44px !important;font-size:10px !important;gap:2px !important;border-radius:12px !important}.tbi svg{width:19px !important;height:19px !important}.zy-pill{bottom:calc(64px + env(safe-area-inset-bottom)) !important}.ctrls{bottom:calc(62px + env(safe-area-inset-bottom)) !important}.ctrls .glass{padding:4px !important;gap:4px !important}.ctrls .pill{height:30px !important;min-width:30px !important;font-size:12px !important;padding:0 8px !important}}

.u-card{background:var(--u-card);border:1px solid var(--u-bd);border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:18px;box-sizing:border-box;min-width:0}
.u-h2{margin:0;font-size:19px;font-weight:700}
.u-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.u-label{display:flex;flex-direction:column;gap:7px;font-size:14px;font-weight:500;min-width:0}
.u-in{height:46px;width:100%;box-sizing:border-box;padding:0 12px;border:1px solid var(--u-in);border-radius:10px;font:inherit;font-size:15px;font-weight:400;color:var(--u-text);background:var(--u-card)}
textarea.u-in{height:auto;min-height:90px;padding:10px 12px;resize:vertical}
.u-in:focus{outline:none;border-color:var(--z1);box-shadow:0 0 0 3px var(--z4)}
.u-btn,.u-btn2,.u-dng{height:44px;padding:0 18px;border-radius:10px;font:inherit;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap;box-sizing:border-box}
.u-btn{border:none;background:var(--z1);color:#FFFFFF;font-weight:600}
.u-btn2{border:1px solid var(--u-in);background:transparent;color:var(--u-text);font-weight:500}
.u-dng{border:none;background:#D1453B;color:#FFFFFF;font-weight:600}
.u-btn:disabled,.u-btn2:disabled,.u-dng:disabled{opacity:.5;cursor:default}
.u-sm{height:36px;padding:0 12px;font-size:13px}
.u-muted{color:var(--u-muted);font-size:13px;line-height:1.5}
.u-msg{font-size:14px;color:var(--z1)}
.u-err{font-size:14px;color:#D1453B}
.u-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.u-av{width:40px;height:40px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:var(--z3);color:var(--z1);font-weight:700;font-size:15px;overflow:hidden}

.u-chip.on{background:var(--z1);border-color:var(--z1);color:#FFFFFF}
.u-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--z3);color:var(--u-text);font-size:12px}
.u-tag button{width:20px;height:20px;border:none;border-radius:50%;background:transparent;color:var(--u-muted);cursor:pointer;font:inherit;font-size:14px;line-height:1}
.u-file{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.u-plus{width:38px;height:38px;border-radius:50%;border:none;background:var(--z1);color:#FFFFFF;font:inherit;font-size:24px;font-weight:400;line-height:1;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;position:relative;text-decoration:none;box-shadow:0 6px 16px rgba(37,99,235,.28)}
.u-top{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px}
.u-top h1{margin:0;font-size:24px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.u-top h1 small{font-size:14px;font-weight:500;color:var(--u-muted)}
@keyframes uOvIn{from{opacity:0}to{opacity:1}}
.u-ov{animation:uOvIn .15s ease both !important;position:fixed;inset:0;z-index:80;background:rgba(5,10,25,.55);display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.u-sheet{width:100%;max-width:520px;max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--u-card);color:var(--u-text);border-radius:20px;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.u-sheet.wide{max-width:760px}
.u-shh{display:flex;align-items:center;justify-content:space-between;gap:10px}
.u-shh h2{margin:0;font-size:18px;font-weight:700}

.u-menu{background:var(--u-card);border:1px solid var(--u-bd);border-radius:18px;overflow:hidden}
.u-mi{display:flex;align-items:center;gap:14px;padding:16px 18px;width:100%;box-sizing:border-box;border:none;background:transparent;color:var(--u-text);font:inherit;font-size:16px;text-align:left;cursor:pointer;text-decoration:none}

.zy-d,.zy-l{--u-card:var(--z10);--u-bd:var(--z11);--u-text:var(--z9);--u-muted:var(--z17);--u-in:var(--z15)}

.croom-li{gap:12px;padding:14px 16px}
.cav{width:48px;height:48px;font-size:17px}

.croom{display:flex;flex-direction:column;height:calc(100vh - 150px);height:calc(100dvh - 150px);min-height:420px;background:var(--u-card);border:1px solid var(--u-bd);border-radius:20px;overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--u-bd);flex:none}
.cback{width:36px;height:36px;border:none;background:transparent;color:var(--z1);font:inherit;font-size:30px;line-height:1;cursor:pointer;flex:none}
.cmsgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 16px;display:flex;flex-direction:column;gap:3px}
.cday{display:flex;justify-content:center;margin:12px 0 6px}
.cday span{font-size:12px;color:var(--u-muted);background:var(--z3);padding:3px 10px;border-radius:999px}
.cmsg{display:flex;align-items:flex-end;gap:8px;max-width:100%}
