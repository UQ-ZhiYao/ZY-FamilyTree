.me{animation:rise .55s cubic-bezier(.2,.8,.3,1.1) backwards,halo 1.8s ease-out 1s infinite}
.ln{animation:lineIn .9s ease backwards}

.zy-d{--pfg:#EAF2FF;--pbtn:#0B1532}

@media (max-width:640px){header{display:none !important}main{padding-top:calc(16px + env(safe-area-inset-top)) !important}.centerpill{top:calc(12px + env(safe-area-inset-top)) !important}}
@media (max-width:640px){.zy-pill{bottom:calc(84px + env(safe-area-inset-bottom));border-radius:16px}}

.tn{position:absolute;width:124px;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-26px);cursor:pointer;animation:tnIn .45s cubic-bezier(.2,.8,.3,1.1) backwards}

.tv-ctl{position:absolute;z-index:4;left:24px;bottom:24px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tv-box{display:flex;align-items:center;gap:6px;padding:6px;border-radius:14px;background:var(--z9);border:1px solid var(--z10);box-shadow:0 6px 18px var(--z11)}

.tv-box button:hover{background:var(--z17)}

.tl-pc.pat{stroke:var(--tpat);opacity:.6}

.tv-lab{display:none}
.tv-seg{top:calc(10px + env(safe-area-inset-top));right:12px}

}

</helmet>
<div class="{{themeCls}}" style="min-height: 100vh; background: var(--z7); color: var(--z8); font-family: 'Inter', 'Noto Sans SC', system-ui, sans-serif; display: flex; flex-direction: column">

<header class="top" style="padding: 16px 24px 0">
<div style="max-width: 1360px; margin: 0 auto; background: var(--z9); border: 1px solid var(--z10); border-radius: 16px; padding: 10px 12px 10px 18px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 6px 20px var(--z11)">
<a href="Circle.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--z8)">
<span style="width: 32px; height: 32px; border-radius: 9px; background: var(--z1); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 21V10M12 14l-5-4M12 12l5-4"></path><circle cx="7" cy="8" r="2" fill="#FFFFFF" stroke="none"></circle><circle cx="17" cy="6" r="2" fill="#FFFFFF" stroke="none"></circle><circle cx="12" cy="5" r="2" fill="#FFFFFF" stroke="none"></circle></svg></span>
<span style="font-size: 17px; letter-spacing: -.2px; font-weight: 700">Zenith Yield</span>
</a>

<a href="Photos.dc.html" class="tab" style="padding: 10px 16px; border-radius: 10px; color: var(--z13); text-decoration: none">{{tabPhotos}}</a>
<a href="Chat.dc.html" class="tab" style="padding: 10px 16px; border-radius: 10px; color: var(--z13); text-decoration: none">{{tabChat}}</a>
<a href="Profile.dc.html" class="tab" style="padding: 10px 16px; border-radius: 10px; color: var(--z13); text-decoration: none">{{tabMe}}</a>
</nav>
<div style="display: flex; align-items: center; gap: 10px">

<a href="Profile.dc.html" class="tab" title="{{L.k1}}" aria-label="{{L.k2}}" style="display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 4px; border-radius: 999px; text-decoration: none; color: var(--z8)">
<span style="width: 36px; height: 36px; border-radius: 50%; background: var(--z15); color: var(--z9); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600">{{meCh}}</span>
<span class="uname" style="font-size: 14px; font-weight: 600">{{meName}}</span>
</a>
<a href="Login.dc.html" onClick="{{zyLogout}}" aria-label="{{L.k3}}" style="width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; color: var(--z16)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"></path></svg></a>
</div>
</div>
</header>

<main class="tv" onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" onWheel="{{onWheel}}">
<div class="tv-world" style="transform: {{wtf}}">
<svg width="1" height="1" aria-hidden="true" style="position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none">
<sc-for list="{{paths}}" as="l" hint-placeholder-count="12"><path class="{{l.cls}}" d="{{l.d}}"></path></sc-for>
</svg>
<sc-for list="{{nodes}}" as="n" hint-placeholder-count="12">
<div class="{{n.cls}}" style="left: {{n.x}}px; top: {{n.y}}px; --ring: {{n.ring}}; animation-delay: {{n.delay}}s" onClick="{{n.open}}" role="button" title="{{n.name}}">
<span class="tn-av" style="background: {{n.avBg}}; color: {{n.avFg}}"><sc-if value="{{n.img}}" hint-placeholder-val="{{false}}"><img src="{{n.img}}" alt=""></sc-if><sc-if value="{{n.noImg}}" hint-placeholder-val="{{true}}">{{n.ch}}</sc-if></span>
<span class="tn-nm">{{n.name}}</span>
<span class="tn-tm">{{n.term}}</span>
<sc-if value="{{n.hasUp}}" hint-placeholder-val="{{false}}"><button type="button" class="tn-x tn-up tv-ui" onClick="{{n.openUp}}" title="{{n.upTip}}" aria-label="{{n.upTip}}">{{n.up}}</button></sc-if>
<sc-if value="{{n.hasDown}}" hint-placeholder-val="{{false}}"><button type="button" class="tn-x tn-dn tv-ui" onClick="{{n.openDown}}" title="{{n.downTip}}" aria-label="{{n.downTip}}">{{n.down}}</button></sc-if>
</div>
</sc-for>
</div>
<sc-for list="{{labs}}" as="b" hint-placeholder-count="5">
<span class="tv-lab" data-y="{{b.y}}" style="top: {{b.top}}px"><b style="color: {{b.color}}">{{b.name}}</b><span>{{b.sub}}</span></span>
</sc-for>
<div class="tv-seg tv-ui" role="group"><a href="Circle.dc.html">{{t.circle}}</a><a href="Tree.dc.html" aria-current="page" class="on">{{t.tree}}</a></div>
<div class="tv-ctl tv-ui">
<div class="tv-box"><button type="button" onClick="{{zout}}" aria-label="-">−</button><span class="tv-pct">{{pct}}</span><button type="button" onClick="{{zin}}" aria-label="+">+</button><button type="button" class="tv-w" onClick="{{zfit}}">{{t.fit}}</button></div>
<div class="tv-box"><button type="button" class="{{patCls}}" onClick="{{pickPat}}" aria-pressed="{{patAria}}"><i></i>{{t.pat}}</button><button type="button" class="{{matCls}}" onClick="{{pickMat}}" aria-pressed="{{matAria}}"><i></i>{{t.mat}}</button></div>
<div class="tv-box"><button type="button" class="tv-w tv-all" onClick="{{toggleAll}}">{{allTxt}}</button><span class="tv-cnt">{{count}}</span></div>
</div>

      unitKids(u).forEach((c) => walk(unitOf[c]));
    };
    // father's family, then mother's, then everyone else (e.g. my spouse's family)
    const SO = { '-1': 0, 1: 1, 0: 2 };
    const roots = units.filter((u) => !unitPar(u).length).sort((a, b) => SO[sideU(a)] - SO[sideU(b)] || a.g - b.g || byBirth(a.mem[0], b.mem[0]));
    roots.forEach((u) => walk(u.i));
    units.forEach((u) => walk(u.i));
    // inside a couple, the partner whose own family sits further right goes on the right
    const gens = Object.keys(rows).map(Number).sort((a, b) => a - b);
    // ---------- positions ----------
    const CW = 124;
    const IN = 10;
    const LM = 0;
    const uw = (k) => units[k].mem.length * CW + (units[k].mem.length - 1) * IN;
    const X = {};
    const famOf = (k) => unitPar(units[k]).join(',');
    const gapBetween = (a, b) => (famOf(a) && famOf(a) === famOf(b) ? 14 : 44);
    gens.forEach((g) => { let x = LM; rows[g].forEach((k, i) => { if (i) x += gapBetween(rows[g][i - 1], k); X[k] = x; x += uw(k); }); });
    const cx = (k) => X[k] + uw(k) / 2;
    const memX = (id) => { const k = unitOf[id]; const i = units[k].mem.indexOf(id); return X[k] + i * (CW + IN) + CW / 2; };
    // keep the row order, move each unit as close as possible to where it wants to be (pool-adjacent-violators)
    const settle = (g, want, wt) => {
      const R = rows[g];
      const blocks = [];
      R.forEach((k, i) => {
        const wi = wt ? wt[i] : 1;
        let b = { ks: [k], off: [0], w: uw(k), sum: want[i] * wi, n: wi, wsum: [wi] };
        b.pos = b.sum;
        while (blocks.length) {
          const pb = blocks[blocks.length - 1];
          const gap = gapBetween(pb.ks[pb.ks.length - 1], b.ks[0]);
          if (pb.pos + pb.w + gap <= b.pos) break;
          blocks.pop();
          const sh = pb.w + gap;
          b = { ks: pb.ks.concat(b.ks), off: pb.off.concat(b.off.map((o) => o + sh)), w: sh + b.w, sum: pb.sum + b.sum - b.n * sh, n: pb.n + b.n, wsum: pb.wsum.concat(b.wsum) };
          b.pos = b.sum / b.n;
        }
        blocks.push(b);
      });
      blocks.forEach((b) => b.ks.forEach((k, j) => { X[k] = b.pos + b.off[j]; }));
    };
    const parentCenter = (k) => {
      const ps = [];
      units[k].mem.forEach((x) => { const pp = vp(x); if (pp.length) ps.push(pp.reduce((s, q) => s + memX(q), 0) / pp.length); });
      return ps.length ? ps.reduce((a, b) => a + b, 0) / ps.length : null;
    };
    const downPass = () => {
      for (let gi2 = 1; gi2 < gens.length; gi2++) {
        const g = gens[gi2];
        const R = rows[g];
        // children of the same parents, centred together under them
        const want = R.map((k) => X[k]);
        const wt = R.map((k) => (parentCenter(k) === null ? 0.05 : 1));
        let i = 0;
        while (i < R.length) {
          let j = i;
          const f = famOf(R[i]);
          while (j + 1 < R.length && f && famOf(R[j + 1]) === f) j++;
          const pc = parentCenter(R[i]);
          if (pc !== null) {
            const w = X[R[j]] + uw(R[j]) - X[R[i]];
            const shift = pc - (X[R[i]] + w / 2);
            for (let q = i; q <= j; q++) want[q] = X[R[q]] + shift;
          }
          i = j + 1;
        }
        settle(g, want, wt);
      }
    };
    const upPass = () => {
      for (let gi2 = gens.length - 2; gi2 >= 0; gi2--) {
        const g = gens[gi2];
        const R = rows[g];
        const want = R.map((k) => {
          const ks = unitKids(units[k]);
          if (!ks.length) return X[k];
          const lo = Math.min.apply(null, ks.map((c) => memX(c)));
          const hi = Math.max.apply(null, ks.map((c) => memX(c)));
          return (lo + hi) / 2 - uw(k) / 2;
        });
        settle(g, want, R.map((k) => (unitKids(units[k]).length ? 1 : 0.05)));
      }
    };
    // alternate: children under their parents, then parents over their children; finish with the parents
    for (let it = 0; it < 8; it++) { downPass(); upPass(); }
    let minX = Infinity;
    let maxX = -Infinity;
    Object.keys(X).forEach((k) => { minX = Math.min(minX, X[k]); maxX = Math.max(maxX, X[k] + uw(+k)); });
    const shiftX = LM - minX;
    Object.keys(X).forEach((k) => { X[k] = Math.round(X[k] + shiftX); });
    const W = Math.max(1, Math.round(maxX + shiftX));
    const RG = 150;
    const Y = {};
    gens.forEach((g, i) => { Y[g] = i * RG; });
    const H = (gens.length - 1) * RG;
    // ---------- nodes, lines, generation labels ----------
    const GC = ['var(--z21)', 'var(--z22)', 'var(--z1)', 'var(--z23)', 'var(--z15)'];
    const AVB = ['var(--z24)', 'var(--z25)', 'var(--z26)', 'var(--z27)', 'var(--z27)'];
    const AVF = ['var(--z28)', 'var(--z29)', 'var(--z2)', 'var(--z23)', 'var(--z15)'];
    const myG = has(meId) ? gen[meId] : 0;
    const gi = (g) => Math.max(0, Math.min(4, 4 + (g - myG)));
    const R0 = 26;
    const nodes = [];
    const paths = [];
    const toggle = (which, idsT, e) => {
      if (e && e.stopPropagation) e.stopPropagation();
      const o = which === 'u' ? openU : openD;
      const on = !idsT.every((x) => o[x]);
      // the side being revealed: the parents' side when opening upwards, the children's side when opening downwards
      const rev = which === 'u' ? parents(idsT[0]) : idsT.reduce((a, x) => a.concat(kids[x] || []), []);
      const sd = rev.map(sideOf).filter((z) => z)[0] || 0;
      if (on && sd && sd !== focus) setFocus(sd);
      idsT.forEach((x) => { if (on) o[x] = 1; else delete o[x]; });
      // keep the tapped person where it is on screen while the tree re-arranges
      const tv0 = this._tv;
      if (tv0 && unitOf[idsT[0]] !== undefined) this._tvAnchor = { id: idsT[0], sx: tv0.x + memX(idsT[0]) * tv0.s, sy: tv0.y + Y[gen[idsT[0]]] * tv0.s };
      this.setState({ tvRev: ((this.state || {}).tvRev || 0) + 1 });
    };
    units.forEach((u) => u.mem.forEach((id, j) => {
      const g = gi(u.g);
      const p = P(id);
      const isMe = id === meId;
      const nm = nameOf(p);
      // folded branches: children (on the couple's first member) and parents (per person)
      const kidsHid = j === 0 ? u.mem.reduce((a, x) => a.concat(hidKids(x).filter((c) => a.indexOf(c) < 0)), []) : [];
      const kidsOpen = j === 0 && u.mem.some((x) => openD[x] && (kids[x] || []).length);
      const parHid = hidPar(id);
      const parOpen = !!openU[id] && parents(id).length > 0 && !(up0[id]);
      nodes.push({
        x: Math.round(memX(id)), y: Y[u.g], name: nm, ch: this._zyInitials(nm), term: term(id), img: this._zyAv(p && p.avatar), noImg: !this._zyAv(p && p.avatar),
        cls: 'tn' + (isMe ? ' me' : '') + (inDirect[id] ? ' dl' : ''), ring: isMe ? 'var(--z15)' : GC[g], avBg: isMe ? 'var(--z15)' : AVB[g], avFg: isMe ? '#FFFFFF' : AVF[g],
        delay: (0.05 + gens.indexOf(u.g) * 0.06).toFixed(2),
        hasDown: kidsHid.length > 0 || kidsOpen, down: kidsHid.length ? '+' + kidsHid.length : '−', downTip: kidsHid.length ? (en ? 'Show ' + kidsHid.length + ' more' : '展开 ' + kidsHid.length + ' 位') : (en ? 'Fold' : '收起'),
        hasUp: parHid.length > 0 || parOpen, up: parHid.length ? '+' + parHid.length : '−',
        upTip: (() => {
          if (!parHid.length) return en ? 'Fold' : '收起';
          const ps = parents(id).map(sideOf).filter((z) => z)[0] || 0;
          if (!focus || !ps || ps === focus) return en ? 'Show parents' : '展开父母';
          return ps < 0 ? (en ? 'Show father’s side' : '切换到父系') : (ps === 1 ? (en ? 'Show mother’s side' : '切换到母系') : (en ? 'Show this family' : '切换到这一家'));
        })(),
        openDown: (e) => toggle('d', u.mem, e), openUp: (e) => toggle('u', [id], e),
        open: () => { if (this._tvMoved) return; if (p && p.id) this._zyGo(this._zyHref('Profile', 'id=' + encodeURIComponent(p.id))); }
      });
    }));
    const line = (d, k) => paths.push({ d: d, cls: k });
    // couples
    const SC = (sd) => (sd < 0 ? ' pat' : (sd === 1 ? ' mat' : ' own'));
    units.forEach((u) => { if (u.mem.length === 2) line('M' + (memX(u.mem[0]) + R0 + 2) + ' ' + Y[u.g] + 'H' + (memX(u.mem[1]) - R0 - 2), 'tl-cp' + SC(sideOf(u.mem[0]) || sideOf(u.mem[1]))); });
    // parents -> children with right-angle lines; buses in the same gap are staggered
    const fams = {};
    Vids.forEach((id) => { const ps = vp(id); if (!ps.length) return; const key = ps.slice().sort().join('|'); (fams[key] = fams[key] || { ps: ps, kids: [] }).kids.push(id); });
    const laneCount = {};
    Object.keys(fams).sort((a, b) => memX(fams[a].ps[0]) - memX(fams[b].ps[0])).forEach((key) => {
      const f = fams[key];
      const pg = Math.max.apply(null, f.ps.map((q) => gen[q]));
      const together = f.ps.length === 2 && unitOf[f.ps[0]] === unitOf[f.ps[1]];
      const px = f.ps.reduce((s2, q) => s2 + memX(q), 0) / f.ps.length;
      const kr = {};
      f.kids.forEach((c) => { (kr[gen[c]] = kr[gen[c]] || []).push(c); });
      Object.keys(kr).forEach((cg) => {
        cg = +cg;
        if (Y[cg] === undefined || Y[pg] === undefined || cg <= pg) return;
        const lane = laneCount[pg] = (laneCount[pg] || 0) + 1;
        const y0 = Y[pg] + (together ? 0 : R0 + 34);
        const yb = Y[pg] + RG * 0.56 + ((lane % 3) - 1) * 7;
        const xs = kr[cg].map(memX);
        let d = 'M' + px + ' ' + y0 + 'V' + yb;
        const lo = Math.min.apply(null, xs.concat([px]));
        const hi = Math.max.apply(null, xs.concat([px]));
        d += 'M' + lo + ' ' + yb + 'H' + hi;
        xs.forEach((x) => { d += 'M' + x + ' ' + yb + 'V' + (Y[cg] - R0 - 3); });
        const ks = kr[cg].map(sideOf).filter((x) => x);
        line(d, 'tl-pc' + SC(ks.length ? ks[0] : 0) + (f.kids.some((c) => inDirect[c]) && f.ps.some((q) => inDirect[q]) ? ' dl' : ''));
      });
    });
    const GN = en ? { '-4': 'Great-great-grandparents', '-3': 'Great-grandparents', '-2': 'Grandparents', '-1': 'Parents', 0: 'My generation', 1: 'Children', 2: 'Grandchildren', 3: 'Great-grandchildren' }
      : { '-4': '高祖辈', '-3': '曾祖辈', '-2': '祖辈', '-1': '父辈', 0: '本辈', 1: '子辈', 2: '孙辈', 3: '曾孙辈' };
    // view: pan / zoom kept on the component; fit everything the first time
    const vw = window.innerWidth || 1200;
    const vh = window.innerHeight || 800;
    const phone = vw < 700;
    const top0 = phone ? 70 : 110;
    const bot0 = phone ? 150 : 110;
    const left0 = phone ? 70 : 150;
    const fit = () => {
      let s2 = Math.max(0.3, Math.min(1.15, (vw - left0 - 30) / (W + 140), (vh - top0 - bot0) / (H + 150)));
      let x2 = left0 + ((vw - left0 - 30) - W * s2) / 2;
      // phones: stay readable and centre on me instead of shrinking the whole tree
      if (phone && s2 < 0.6) { s2 = Math.max(s2, Math.min(0.6, (vh - top0 - bot0) / (H + 150))); if (has(meId) && unitOf[meId] !== undefined) x2 = vw / 2 - memX(meId) * s2; }
      return { s: s2, x: x2, y: top0 + 40 * s2 + ((vh - top0 - bot0) - (H + 120) * s2) / 2 };
    };
    if (!this._tv) this._tv = fit();
    if (this._tvRefit) { this._tv = fit(); this._tvRefit = false; }
    if (this._tvAnchor) {
      const A2 = this._tvAnchor;
      this._tvAnchor = null;
      if (unitOf[A2.id] !== undefined) { this._tv.x = A2.sx - memX(A2.id) * this._tv.s; this._tv.y = A2.sy - Y[gen[A2.id]] * this._tv.s; }
    }
    const tv = this._tv;
    const labs = gens.map((g, i) => ({ y: Y[g], top: Math.round(tv.y + Y[g] * tv.s), color: GC[gi(g)] === 'var(--z21)' ? 'var(--z28)' : GC[gi(g)], name: en ? 'Gen ' + (i + 1) : '第' + '一二三四五六七八九十'.charAt(i) + '代', sub: GN[g - myG] || (en ? 'Relatives' : '亲属') }));
    const apply = () => {
      const w = document.querySelector('.tv-world');
      if (w) w.style.transform = 'translate(' + tv.x + 'px,' + tv.y + 'px) scale(' + tv.s + ')';
      document.querySelectorAll('.tv-lab').forEach((el) => { el.style.top = Math.round(tv.y + (+el.getAttribute('data-y')) * tv.s) + 'px'; });
      const pc = document.querySelector('.tv-pct');
      if (pc) pc.textContent = Math.round(tv.s * 100) + '%';
    };
    const zoomAt = (f, cx, cy) => {
      const ns = Math.max(0.25, Math.min(2.5, tv.s * f));
      tv.x = cx - (cx - tv.x) * ns / tv.s;
      tv.y = cy - (cy - tv.y) * ns / tv.s;
      tv.s = ns;
      apply();
    };
    const ptr = this._tvPtr || (this._tvPtr = {});
    const shownN = Vids.length;
    return {
      t: t, nodes: nodes, paths: paths, labs: labs, W: W + 400, H: H + 300,
      wtf: 'translate(' + tv.x + 'px,' + tv.y + 'px) scale(' + tv.s + ')', pct: Math.round(tv.s * 100) + '%',
      count: en ? 'Showing ' + shownN + ' of ' + total : '显示 ' + shownN + ' / ' + total + ' 人', allOpen: !!this._tvAll,
      allTxt: this._tvAll ? (en ? 'Direct line only' : '只看直系') : (en ? 'Show whole side' : '展开整边'),
      patOn: focus < 0, matOn: focus > 0, patCls: 'tv-sd pat' + (focus < 0 ? ' on' : ''), matCls: 'tv-sd mat' + (focus > 0 ? ' on' : ''),
      patAria: focus < 0 ? 'true' : 'false', matAria: focus > 0 ? 'true' : 'false',
      pickPat: () => { setFocus(focus < 0 ? 0 : -1); this._tvRefit = true; this.setState({ tvRev: ((this.state || {}).tvRev || 0) + 1 }); },
      pickMat: () => { setFocus(focus > 0 ? 0 : 1); this._tvRefit = true; this.setState({ tvRev: ((this.state || {}).tvRev || 0) + 1 }); },
      toggleAll: () => {
        if (this._tvAll) { this._tvAll = false; Object.keys(openD).forEach((k) => delete openD[k]); Object.keys(openU).forEach((k) => delete openU[k]); }
        else { this._tvAll = true; if (!focus) setFocus(-1); else setFocus(focus); }
        this._tvRefit = true;
        this.setState({ tvRev: ((this.state || {}).tvRev || 0) + 1 });
      },
      zin: () => zoomAt(1.2, vw / 2, vh / 2), zout: () => zoomAt(1 / 1.2, vw / 2, vh / 2),
      zfit: () => { const f2 = fit(); tv.x = f2.x; tv.y = f2.y; tv.s = f2.s; apply(); },
      onWheel: (e) => { if (e.preventDefault) e.preventDefault(); zoomAt(Math.exp(-e.deltaY * 0.0015), e.clientX, e.clientY); },
      onDown: (e) => {
        if (e.target && e.target.closest && e.target.closest('.tv-ui')) return;
        ptr[e.pointerId] = { x: e.clientX, y: e.clientY };
        this._tvMoved = false;
        this._tvStart = { x: e.clientX, y: e.clientY };
      },
      onMove: (e) => {
        const p0 = ptr[e.pointerId];
        if (!p0) return;
        const keys = Object.keys(ptr);
        if (keys.length >= 2) {
          const a = ptr[keys[0]];
          const b = ptr[keys[1]];
          const d0 = Math.hypot(a.x - b.x, a.y - b.y);
          p0.x = e.clientX; p0.y = e.clientY;
          const d1 = Math.hypot(a.x - b.x, a.y - b.y);
          if (d0 > 0 && d1 > 0) zoomAt(d1 / d0, (a.x + b.x) / 2, (a.y + b.y) / 2);
          this._tvMoved = true;
          return;
        }
        const dx = e.clientX - p0.x;
        const dy = e.clientY - p0.y;
        p0.x = e.clientX; p0.y = e.clientY;
        if (this._tvStart && Math.hypot(e.clientX - this._tvStart.x, e.clientY - this._tvStart.y) > 6) this._tvMoved = true;
        if (!this._tvMoved) return;
        tv.x += dx; tv.y += dy;
        apply();
      },
      onUp: (e) => { delete ptr[e.pointerId]; setTimeout(() => { if (!Object.keys(ptr).length) this._tvMoved = false; }, 30); }
    };
  }
}
</script>
